name: CDJ-2000 SH-4 emulator build
on:
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-venv python3-pip \
            curl ca-certificates pkg-config ninja-build meson libglib2.0-dev \
            libpixman-1-dev zlib1g-dev libfdt-dev libcapstone-dev \
            libslirp-dev liburing-dev libaio-dev flex bison git unzip
      - name: Download pinned QEMU and compile CDJ SH-4 emulator
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-qemu.sh 2>&1 | tee build-output.log
      - name: Upload result and diagnostic logs (also if build fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CDJ2000-sh4-qemu-build
          path: |
            build-output.log
            ci-output/
            work/qemu-master/build/meson-logs/
          if-no-files-found: warn
          retention-days: 7
